services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://app:app@postgres:5432/app
      # Compose reads these values from .env.
      LLM_MODEL: ${LLM_MODEL:-}
      SYSTEMONE_MODEL: ${SYSTEMONE_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    # A local model server on the host is at host.docker.internal. Docker
    # Desktop adds the name; this line adds it on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # The worker runs the background jobs (internal/platform/jobs) from the
  # same image. Start more replicas with --scale worker=3: the queue gives
  # each job to one replica. Add the keys that a job needs.
  worker:
    build: .
    command: ["worker"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgres://app:app@postgres:5432/app
    # Run gives the running jobs 10s and then 2s more. The default 10s
    # stop period of Docker is too short.
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Tests use this database. A container replacement removes its data.
  postgres-test:
    profiles: [test]
    tmpfs:
      - /var/lib/postgresql
    image: postgres:18
    environment:
      POSTGRES_USER: app_test
      POSTGRES_PASSWORD: app_test
      POSTGRES_DB: app_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_test -d app_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
